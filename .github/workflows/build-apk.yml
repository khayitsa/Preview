name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's runner already has the Android SDK. (The android-actions/setup-android action
      # currently crashes on it, so we only record the licence acceptance Gradle needs.)
      - name: Accept Android SDK licences
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
      # Use a Gradle installed by the runner, so a missing wrapper jar or lost "executable" flag
      # (common when a project is committed from Windows) cannot break the build.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        env:
          # Repo > Settings > Secrets and variables > Actions > Variables > FEFFEL_URL
          FEFFEL_URL: ${{ vars.FEFFEL_URL }}
        run: |
          test -n "$FEFFEL_URL" || { echo "Set the FEFFEL_URL repository variable (https://you.pythonanywhere.com)"; exit 1; }
          gradle --no-daemon --stacktrace assembleDebug -PfeffelUrl="$FEFFEL_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Feffel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
